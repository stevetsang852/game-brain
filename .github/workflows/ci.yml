name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests without a ROM
        run: python -m pytest -q tests/test_goals_cache.py tests/test_nav.py
      - name: Run the rest of the suite
        run: python -m pytest -q
